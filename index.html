<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yeşil Vadi — Sonsuz Koşu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="brand">
      <h1>Yeşil Vadi</h1>
      <p>sonsuz koşu</p>
    </div>

    <div class="scoreboard">
      <span class="score-label">SKOR</span>
      <span class="score" id="score">0</span>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">REKOR</span>
        <strong id="best">0</strong>
      </div>
      <div class="stat coin-stat">
        <span class="coin-icon"></span>
        <strong id="coins">0</strong>
      </div>
    </div>
  </div>

  <div class="hint hidden" id="hint">
    <kbd>Boşluk</kbd><span>veya</span><kbd>↑</kbd><span>zıpla</span>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <p class="eyebrow" id="ovEyebrow">sonsuz koşu</p>
      <h2 id="ovTitle">Yeşil Vadi</h2>
      <p class="desc" id="ovDesc">
        Şapkalı çiftçimiz vadiyi koşarak geçiyor. Engellere çarpmadan
        mümkün olduğunca uzağa git, altınları topla.
      </p>

      <div class="result" id="ovResult" hidden>
        <div class="result-item">
          <span>Skor</span>
          <strong id="finalScore">0</strong>
        </div>
        <div class="result-item">
          <span>Mesafe</span>
          <strong id="finalDist">0 m</strong>
        </div>
        <div class="result-item">
          <span>Rekor</span>
          <strong id="finalBest">0</strong>
        </div>
      </div>

      <button class="btn" id="ovBtn" type="button">Koşmaya başla</button>
      <p class="tip">Boşluk / ↑ / ekrana dokun</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/draw-bg.js"></script>
  <script src="js/draw-entities.js"></script>
  <script src="js/draw-runner.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
